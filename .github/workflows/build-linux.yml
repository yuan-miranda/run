name: Build Linux Binaries

on:
  workflow_dispatch: # Allows clicking "Run workflow" manually in GitHub Actions tab
  push:
    branches: [ main ]
    paths:
      - 'client.py'
      - 'installer.py'
      - 'requirements.txt'
      - '.github/workflows/build-linux.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create temporary client config from secret
        env:
          SECRET_PASS: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          python3 -c "import os; f = open('client_config.py', 'w'); f.write('CLIENT_KEY = ' + repr(os.environ.get('SECRET_PASS', '')) + '\nCLIENT_VERSION = \"${{ github.sha }}\"[:7]\n'); f.close()"

      - name: Compile standalone Linux binaries
        run: |
          pyinstaller --noconsole --onefile --clean -n run client.py
          pyinstaller --noconsole --onefile --clean -n installer installer.py
          cp dist/run ./run
          cp dist/installer ./installer
          chmod +x run installer
          rm -f client_config.py

      - name: Commit and push compiled Linux binaries
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add run installer
          git diff --quiet && git diff --staged --quiet || (git commit -m "build: compile linux release binaries [skip ci]" && git push)
