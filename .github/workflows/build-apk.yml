name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure Client Credentials
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -n "$DASHBOARD_PASSWORD" ]; then
            sed -i "s/\"qqqq\"/\"$DASHBOARD_PASSWORD\"/g" android/app/src/main/java/com/run/client/Config.java
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew assembleDebug --stacktrace; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle build failed after 3 attempts"
              exit 1
            fi
            echo "Gradle build failed, retrying in 30 seconds..."
            sleep 30
          done

      - name: Copy APK to Root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./run.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-android-apk
          path: ./run.apk

      - name: Commit and push Android APK
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add run.apk
          git diff --cached --quiet || (git commit -m "build: update android release binary [skip ci]" && git pull --rebase && git push)
