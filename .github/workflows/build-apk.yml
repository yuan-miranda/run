name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Copy APK to Root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./run.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-android-apk
          path: ./run.apk

      - name: Commit and push Android APK
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add run.apk
          git diff --cached --quiet || (git commit -m "build: update android release binary [skip ci]" && git push)
