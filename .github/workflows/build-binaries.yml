name: Build Release Binaries (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client.py'
      - 'installer.py'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create temporary client config from secret
        env:
          SECRET_PASS: ${{ secrets.DASHBOARD_PASSWORD }}
        shell: pwsh
        run: |
          python -c "import os; f = open('client_config.py', 'w'); f.write('CLIENT_KEY = ' + repr(os.environ.get('SECRET_PASS', '')) + '\nCLIENT_VERSION = \"${{ github.sha }}\"[:7]\n'); f.close()"

      - name: Compile Windows binaries
        shell: cmd
        run: |
          pyinstaller --noconsole --onefile --clean -n run client.py
          pyinstaller --noconsole --onefile --clean -n installer installer.py
          copy dist\run.exe .\run.exe
          copy dist\installer.exe .\installer.exe
          del client_config.py

      - name: Commit and push release binaries
        shell: pwsh
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add run.exe installer.exe
          $diff = git status --porcelain
          if ($diff) {
              git commit -m "build: update windows release binaries [skip ci]"
              git push
          }
