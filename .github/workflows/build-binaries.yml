name: Build Release Binaries (Windows & Linux)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client.py'
      - 'installer.py'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create temporary client config from secret
        env:
          SECRET_PASS: ${{ secrets.DASHBOARD_PASSWORD }}
        shell: bash
        run: |
          python -c "import os; f = open('client_config.py', 'w'); f.write('CLIENT_KEY = ' + repr(os.environ.get('SECRET_PASS', '')) + '\nCLIENT_VERSION = \"${{ github.sha }}\"[:7]\n'); f.close()"

      - name: Compile Windows binaries
        shell: cmd
        run: |
          pyinstaller --noconsole --onefile --clean -n run client.py
          pyinstaller --noconsole --onefile --clean -n installer installer.py
          copy dist\run.exe .\run.exe
          copy dist\installer.exe .\installer.exe
          del client_config.py

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            run.exe
            installer.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create temporary client config from secret
        env:
          SECRET_PASS: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          python3 -c "import os; f = open('client_config.py', 'w'); f.write('CLIENT_KEY = ' + repr(os.environ.get('SECRET_PASS', '')) + '\nCLIENT_VERSION = \"${{ github.sha }}\"[:7]\n'); f.close()"

      - name: Compile standalone Linux binaries
        run: |
          pyinstaller --noconsole --onefile --clean -n run client.py
          pyinstaller --noconsole --onefile --clean -n installer installer.py
          cp dist/run ./run
          cp dist/installer ./installer
          chmod +x run installer
          rm -f client_config.py

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            run
            installer

  commit-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: ./

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: ./

      - name: Make Linux binaries executable
        run: |
          chmod +x run installer

      - name: Commit and push unified release binaries
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add run.exe installer.exe run installer
          git diff --quiet && git diff --staged --quiet || (git commit -m "build: update release binaries (windows & linux) [skip ci]" && git push)
