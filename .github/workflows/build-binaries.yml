name: Build Release Binaries (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client.py'
      - 'installer.py'
      - 'build.py'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows binaries
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          CLIENT_VERSION: ${{ github.sha }}
        shell: cmd
        run: |
          python build.py

      - name: Commit and push release binaries
        shell: cmd
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add run.exe installer.exe
          git diff --cached --quiet || (git commit -m "build: update windows release binaries [skip ci]" && git push)
